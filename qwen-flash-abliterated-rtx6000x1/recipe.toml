# The recipe this repository hosts, instantiated from templates/recipe. Its `default` profile is the one-GPU profile
# of an earlier, unpublished NVFP4 recipe for this card, and that recipe's control pack (nvidia @ fc694b54) remains
# the reference weights. The kit this recipe pins is the copy in this repository.

[recipe]
name = "qwen-flash-abliterated-rtx6000x1"
model = "dealignai/Qwen3.8-Flash-Next-ABLITERATED-NVFP4"
model_type = "qwen4_exp"          # a key of the built binary's capabilities --json families (Flash Next)
format = "modelopt-mixed"         # the family's ModelOpt mixed-precision format (NVFP4 experts)
ships = ["default"]
served_name = "flash"
port = 8090

# The kit revision this recipe runs with (git rev-parse HEAD in this repository's checkout); any other
# refuses to run. A hosted run from a later checkout passes --kit-dev and stamps its receipts dev.
[kit]
rev = "af19cdc4f6d3d5adb718dd9c53508722a575e597"
testkit = ">=0.1,<1"

# Upstream main plus four series, applied in order: patches/loader reads the shipped pack's ModelOpt config
# and fused BF16 MTP experts; patches/tp1 (to 0011) the one-GPU lanes, each series switch off by default
# except TF_FLASHNEXT_KEPT; patches/re-pin reconciles the two series' own re-pin patches, which were each
# written against its series alone and do not stack: it carries their union, every row the hash of this
# tree's own file. The one-GPU series' 0012 re-pin is superseded by it. patches/disk sizes the disk tier's
# staging permit to one whole state at the served window, so one long prompt reaches --prompt-cache-disk.
# patches/dynkv puts the engine's own stream on upstream's K/V page pool too under TF_FLASHNEXT_KV_PAGES_ALL,
# so every stream shares one pool.
[engine.cuda]
repo = "https://github.com/ashhart/TensorFold.git"
rev = "1a3a10d9194c58decd228ce3084f1ccae885a26a"  # upstream main, 2026-11-26
tree = "0272db7df4948f9e93016b26057b86ed9b550e10"
series = ["patches/loader", "patches/tp1:0011", "patches/re-pin", "patches/disk", "patches/dynkv"]

# vars are defaults that the environment overrides (NVCC=... GPU=... recipe prepare).
# GPU is the -Dgpu target: sm_80, sm_86, sm_89, sm_110, sm_120, sm_121 or spark. CPU is the -Dcpu target: native
# for this host only; a binary for another host names its CPU level (the release bundle is x86_64_v3).
[engine.cuda.build]
vars = { NVCC = "/usr/local/cuda/bin/nvcc", GPU = "sm_120", CPU = "native" }
executables = ["NVCC"]
steps = [["zig", "build", "-Dgpu={GPU}", "-Dnvcc={NVCC}", "-Dcpu={CPU}"]]
outputs = ["zig-out/native/bin/tensorfold-native"]

# libtfgrammar, for required and named tool calls and response_format. XGRAMMAR=DIR uses a checkout,
# XGRAMMAR=none skips it, otherwise ENGINE_DIR/.xgrammar is cloned at the tag and checked against the commit.
[[engine.cuda.build.addon]]
name = "xgrammar"
var = "XGRAMMAR"
repo = "https://github.com/mlc-ai/xgrammar"
tag = "v0.2.8"
commit = "97787376faee5ed8466cfad57c99855e4ce2f6aa"
steps = [["zig", "build", "grammar", "-Dxgrammar={XGRAMMAR}", "-Dcpu={CPU}"]]
outputs = ["zig-out/native/lib/libtfgrammar.so"]

# The shipped weights: the abliterated pack. The control pack (nvidia/Qwen3.8-Flash-Next-NVFP4 at fc694b54)
# is recorded beside them in config/: this pin reproduces the earlier one-GPU reference's hashes on it.
# The kit holds one weight set; the control set is this recipe's own addition, in config/control.*.
[weights]
rev = "be794b990578ef3031eccf9f28e675a289a09ee9"
sha256 = "config/weights.sha256"

[hardware]
profile = "rtx6000x1"

# What recipe gate holds the server to: a conformance profile in upstream's tools/conformance_profiles format,
# and the expected token hashes by prompt and profile ("*" for every profile without its own row), recorded on one
# 6000 by tools/rental.sh; the cold rows name the bench's prompts.
# gates/control.hashes.json holds the earlier one-GPU reference on the control pack, and
# gates/spark.hashes.json the shipped pack's GB10 hashes, a reference for that run, never its expected row.
[gates]
conformance = "gates/conformance.json"
hashes = "gates/hashes.json"

# What recipe bench measures: ABBA (control A B B A control), a fresh server an arm. The first cell decides
# "better"; any cell the bar below decides "worse". cold.SIZE cells need a cold row in gates/hashes.json.
[bench]
cells = ["decode.code.x1", "decode.chat.x1", "decode.code.x16", "decode.chat.x16", "cold.8192"]
rounds = 2
bar = 0.03
control = true

# What recipe soak runs: mixed traffic with cancels, at the hardware profile's floors.
[soak]
minutes = 30
workers = 4
probe_min = 5

# The earlier recipe's one-GPU profile: --context 16384 --parallel 16, every lane off, upstream main's behaviour,
# and the reproduction reference: the control pack gives the earlier one-GPU hashes (code 4e759dbd859c, chat 764da77fbd3f, cold 8K fa345c10f631; full values in
# gates/control.hashes.json). KEPT=device pins main's memory layout for that check: the TP1 series keeps
# prompt states in pinned host memory by default on a discrete card. Upstream now defaults
# TF_FLASHNEXT_READOUT_FUSED on for prompt passes; if a hash moves, isolate with =0 before calling it a
# regression.
[profile.default]
topology = {}
context = 16384
parallel = 16
settings = { TF_FLASHNEXT_KEPT = "device" }

# The ship profile once measured: the TP1 series' proposed default, every lever on. Each lever is expected,
# not yet proven exact at TP1 (see README.md#levers-and-switches): hash-gate first, then one ABBA against
# the default profile at the 3% bar; a loser drops off here, a winner stays. KEPT=host restates the series'
# default for the ship profile.
[profile.optimised]
inherits = "default"
parallel = 12
settings = { TF_FLASHNEXT_KEPT = "host", TF_FLASHNEXT_GDN_SPLIT = "1", TF_FLASHNEXT_CHUNK_SOLO = "8192", TF_FLASHNEXT_ATTN_LANES = "1", TF_FLASHNEXT_ROLL_BATCH = "1", TF_FLASHNEXT_ROUTE_FUSED = "1", TF_FLASHNEXT_READOUT_DECODE = "1" }

# The long-context agent window: the model's own 262,144 tokens, so coding agents stop compacting their history
# and mis-quoting edit text. Every stream takes K/V pages of one shared pool as its request needs them
# (patches/dynkv): a short chat holds a few thousand tokens, one session can grow to the whole window, and a
# request the pool cannot hold yet waits in the queue. Eight streams; the prompt cache 32 GiB in host RAM. Every
# lever inherits the optimised profile, so every one of them is expected, not yet proven exact at TP1.
# Every prompt state the RAM cache keeps is also written to prompt-cache-disk and read back after an eviction or a
# restart (a GB10 revisits a one-prompt 128K session from NVMe in 5.1 s against 67 s cold, same tokens). The default folder is
# relative to where the server starts; point it at an NVMe with `-- --prompt-cache-disk DIR` (the last one wins).
# The store takes at most 128 GiB, leaves 32 GiB of the disk free and writes at most 512 GiB a day.
[profile.agent]
inherits = "optimised"
context = 262144
parallel = 8
flags = { prompt-cache-gib = 32, prompt-cache-disk = "prompt-cache", spill-gib = 128, learn-gib = 128, learn-min-free-gib = 32, learn-daily-gib = 512 }
settings = { TF_FLASHNEXT_CHUNK_SOLO = false, TF_FLASHNEXT_KV_PAGES = "256", TF_FLASHNEXT_KV_PAGES_ALL = "1" }

# The one lever outside the ship profile: NVFP4 accepts fewer drafts than FP8, so 12 greedy drafts is
# measured by its own arm before it joins anything.
[arm.drafts-greedy]
base = "default"
experiments = { TF_FLASHNEXT_DRAFTS_GREEDY = "12" }

# Every switch this recipe knows, classified per docs/switch-policy.md. The ship profile's levers are product
# rows (a served profile may set only product rows) whose reasons carry their evidence; every one of them is
# expected, not yet proven exact at TP1, and the README says so beside each. DRAFTS_GREEDY is the one
# experiment, set by its own arm.
[[switch]]
name = "TF_FLASHNEXT_KEPT"
kind = "product"
reason = "where kept prompt states live: device pins main's memory layout on the reproduction reference, host frees VRAM for KV on the ship profile (the series' default on a discrete card)"
doc = "README.md#levers-and-switches"
hardware = ["rtx6000x1"]

[[switch]]
name = "TF_FLASHNEXT_GDN_SPLIT"
kind = "product"
reason = "fused prompt passes split the DeltaNet chain over (value head, 64-row slice) when every block has an SM: measured +9.7% cold 32K on one RTX PRO 6000 on the old pin, exact; expected, not yet proven at TP1 on this pin"
doc = "docs/PERFORMANCE.md"
hardware = ["rtx6000x1"]
receipt = "docs/PERFORMANCE.md"

[[switch]]
name = "TF_FLASHNEXT_CHUNK_SOLO"
kind = "product"
reason = "a solo prompt pass takes up to this many rows: measured +15-23% solo prefill on a 6000-class card elsewhere; expected, not yet proven at TP1"
doc = "README.md#levers-and-switches"
hardware = ["rtx6000x1"]

[[switch]]
name = "TF_FLASHNEXT_ATTN_LANES"
kind = "product"
reason = "batched attention lanes: measured +2.5% on one card elsewhere and +1.3-1.6% at x8/x16; expected, not yet proven at TP1"
doc = "README.md#levers-and-switches"
hardware = ["rtx6000x1"]

[[switch]]
name = "TF_FLASHNEXT_ROLL_BATCH"
kind = "product"
reason = "a partial keep's DeltaNet replay in three launches, not about 146: part of a measured +4.3% decode stack elsewhere, each alone within noise; expected, not yet proven exact at TP1"
doc = "README.md#levers-and-switches"
hardware = ["rtx6000x1"]

[[switch]]
name = "TF_FLASHNEXT_ROUTE_FUSED"
kind = "product"
reason = "router logits, top-k and plan in two launches for passes of 16 rows or fewer; the NVFP4 plan path never ran on a GPU; expected, not yet proven exact at TP1"
doc = "README.md#levers-and-switches"
hardware = ["rtx6000x1"]

[[switch]]
name = "TF_FLASHNEXT_READOUT_DECODE"
kind = "product"
reason = "a decode pass's BF16 hyper-connection read-out in two launches for passes under 64 rows; expected, not yet proven exact at TP1"
doc = "README.md#levers-and-switches"
hardware = ["rtx6000x1"]

[[switch]]
name = "TF_FLASHNEXT_KV_PAGES"
kind = "product"
reason = "every stream's K/V in 256-token pages of one pool sized by the boot budget, taken per request: on one GB10 the same 12 token hashes as fixed windows and an ABBA within 0.3% (decode x1 -0.1%, x4 +1.5%, cold 8K +0.3%); not yet measured on a 6000"
doc = "README.md#levers-and-switches"
hardware = ["rtx6000x1"]
receipt = "docs/CAPACITY.md"

[[switch]]
name = "TF_FLASHNEXT_KV_PAGES_ALL"
kind = "product"
reason = "puts the engine's own stream on the pool too (patches/dynkv), so no idle window is held: the agent profile's 262,144 x 8 boots with 8 streams on one shared pool; on one GB10 the same 12 token hashes"
doc = "README.md#levers-and-switches"
hardware = ["rtx6000x1"]
receipt = "docs/CAPACITY.md"

[[switch]]
name = "TF_FLASHNEXT_DRAFTS_GREEDY"
kind = "experiment"
owner = "recipe-maintainer"
decides = "ABBA of arm drafts-greedy against profile default on one RTX PRO 6000, bar 3%; NVFP4 accepts fewer drafts than FP8, so it is measured alone"
added = "2026-11-27"
expires = "2027-02-25"
