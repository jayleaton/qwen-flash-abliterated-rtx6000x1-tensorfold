# Two RTX PRO 6000 Blackwell cards in one host, peer to peer over PCIe.
[chip]
arch = 120
gpu = "sm_120"
ranks = 2
unified = false

[comm]
transport = "pcie-p2p"
# NCCL over PCIe peer to peer instead of shared host memory.
env = { NCCL_P2P_LEVEL = "SYS" }

[memory]
# Free memory on the emptiest card.
floor_gib = 4.0
gate_gib = "by-recipe"
drop_caches = true

[thermal]
pause_c = 85
resume_c = 75
hard_c = 90
hard_hold_s = 30

[power]
# Each card's board power limit; a capped card's numbers do not compare.
limit_w = 600

[bench]
note = "numbers from one host do not predict another host's: publish same-host ABBA only"
