[project]
name = "tensorfold-recipe-kit"
version = "0.2.0"
description = "The recipe command: prepare a TensorFold engine from a recipe.toml"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
recipe = "recipe_kit.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["kit"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["templates", "tests/fixtures/*/engine"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
