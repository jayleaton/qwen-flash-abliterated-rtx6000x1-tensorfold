[project]
name = "tensorfold-testkit"
version = "0.4.1"
description = "Shared recipe test framework: served gates and a stand-in server; ABBA bench, soak and receipts follow"
requires-python = ">=3.11"
license = "Apache-2.0"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
